# Example: PlatformIO project with two firmware variants.
# Copy to .github/workflows/firmware.yml in the product repo, then adjust:
#   - the matrix (PlatformIO environment -> firmware variant from firmware.yml)
#   - CHIP, the product key, and the concurrency group name
name: Firmware

on:
  push:
    branches:
      - "release**"      # release, release-1.2, release/1.2
      - "stable**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # v1.4.0, but not v-test
  workflow_dispatch:

# One publish at a time per product, across all workflows and branches in this repo.
concurrency:
  group: firmware-publish-openfan-micro-v2
  cancel-in-progress: true

env:
  CHIP: esp32c3

jobs:
  build:
    #runs-on: ubuntu-24.04
    runs-on: [self-hosted, docker-runner]
    strategy:
      matrix:
        include:
          - env: standard
            variant: standard

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: pip install -r requirements.txt
        working-directory: ./Firmware

      - name: Build
        run: pio run -e ${{ matrix.env }}
        working-directory: ./Firmware

      - name: Show build output
        run: find . -name 'merged-firmware.bin' -not -path './.git/*' -ls

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: fw-${{ matrix.variant }}
          path: ./Firmware/.pio/build/${{ matrix.variant }}/merged-firmware.bin

  publish:
    needs: build
    if: >-
      github.event_name != 'pull_request' && (
        startsWith(github.ref, 'refs/heads/release') ||
        startsWith(github.ref, 'refs/heads/stable') ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-24.04
    steps:
      # Downloads every artifact into its own folder: fw-standard/merged-firmware.bin, fw-unraid/merged-firmware.bin
      - uses: actions/download-artifact@v8

      - uses: SasaKaranovic/docs-esp-firmware-publish@v1
        with:
          product: openfan-micro
          builds: |
            standard=merged-firmware.bin
          channel: >-
            ${{ (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/stable')) && 'stable' || 'preview' }}
          host: ${{ secrets.FIRMWARE_DEPLOY_HOST }}
          ssh-key: ${{ secrets.FIRMWARE_DEPLOY_KEY }}
          known-hosts: ${{ secrets.FIRMWARE_KNOWN_HOSTS }}
